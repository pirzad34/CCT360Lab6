<div class="container mt-5">

    <form style="max-width:950px; margin:0px auto">

        <div class="row g-4">
            <div class="md:col-6">
                <div class="mb-3">
                    <label for="exampleInputFirstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="exampleInputEmail1">
                </div>
            </div>
            <div class="md:col-6">
                <div class="mb-3">
                    <label for="exampleLastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="exampleInputPassword1">
                </div>
            </div>
        </div>

        <div class="row g-4" >
            <div class="md:col-6">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
                </div>
            </div>
            <div class="md:col-6">
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
                </div>
            </div>
            <div class="md:col-6">
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Address</label>
                    <input type="text" class="form-control" id="exampleInputPassword1">
                </div>
            </div>
            <div class="md:col-6">
                <div class="mb-3 form-field md:mt-5 md:pt-5">
                    <input type="checkbox" id="exampleCheck1" class="check">
                    <label for="exampleCheck1">Check me out</label>
                </div>
            </div>
        </div>
  
    <button type="submit" class="btn-solid theme-primary">Submit</button>
    </form>







</div>
